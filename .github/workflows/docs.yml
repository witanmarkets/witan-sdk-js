name: docs

# The documentation site, one copy per release (mike on the gh-pages branch, served by
# GitHub Pages at https://witanmarkets.github.io/witan-sdk-js/). A release tag deploys its
# version and moves `stable` to it; main deploys `dev`. The API reference is generated by
# TypeDoc from that version's source. Releases older than the site get their README and
# reference once (tools/docs_backfill.py).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci || npm install
      - run: npm install --no-save typedoc@0.28 typedoc-plugin-markdown@4
      - run: pip install -r requirements-docs.txt
      - name: Git identity and the published branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
      - name: API reference from this version's source
        run: npx typedoc
      - name: Build strictly first
        run: mkdocs build --strict
      - name: Releases older than the site
        run: python tools/docs_backfill.py
      - name: This release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          mike deploy --update-aliases --title "$v" "$v" stable
          mike set-default stable
      - name: Unreleased main
        if: github.ref == 'refs/heads/main'
        run: mike deploy --title "dev (unreleased)" dev
      - run: git push origin gh-pages

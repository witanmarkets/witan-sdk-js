name: publish

# This repository is the public mirror of sdk/js in the WITAN platform repo and the only place
# releases are cut. Tag vX.Y.Z (matching package.json) to publish through npm Trusted Publishing:
# the job proves who it is with GitHub's OIDC token, so no npm token is stored anywhere, and npm
# attaches provenance (this repository is public). By default the version is *staged*: it waits
# on npmjs.com until a maintainer approves it with 2FA. Set the repository variable
# NPM_PUBLISH=direct to skip that (the npm trusted publisher must allow direct publish too).
#
# Once the publish step is done, the tag gets its GitHub Release, with the version's CHANGELOG.md
# entry as the notes (.github/scripts/github-release.sh), so the Releases page never lags npm.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24", "26"]   # README, Requirements: Node.js 22 or newer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  # the other runtimes named under Requirements in README.md: the oldest version listed, and the newest
  runtimes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: deno, version: "v2.0.0" }
          - { runtime: deno, version: "v2.x" }
          - { runtime: bun, version: "1.3.3" }
          - { runtime: bun, version: "latest" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund && npm run build
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.version }}
      - if: matrix.runtime == 'deno'
        run: deno --version && deno test -A --no-check test/unit.mjs
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}
      - if: matrix.runtime == 'bun'
        run: bun --version && bun test ./test/unit.mjs

  # Cloudflare Workers (workerd, through miniflare), Vercel Edge (edge-runtime), and the oldest TypeScript
  edge-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund && npm run build
      - run: npm run test:edge
      - run: npm run test:types

  publish:
    needs: [test, runtimes, edge-and-types]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # the OIDC token npm trusts; nothing else authenticates this job
    steps:
      - uses: actions/checkout@v4
      # no registry-url / always-auth here: with them npm looks for a token and fails
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm 11.15+ (trusted publishing needs 11.5.1, staged publishing 11.15)
        run: npm install -g npm@^11.15.0 && npm --version
      - name: Check the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      # npm swallows a refused OIDC exchange and only says "need auth" (ENEEDAUTH). Ask the
      # registry ourselves first and show what it matches against: the run's claims are not
      # secret; the tokens are masked and never printed.
      - name: Check npm trusts this run
        run: |
          set -euo pipefail
          idt=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).value")
          echo "::add-mask::$idt"
          node -e '
            const c = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url").toString());
            for (const k of ["repository", "workflow_ref", "environment", "ref"]) console.log(k + ": " + c[k]);
          ' "$idt"
          name=$(node -p "require('./package.json').name")
          code=$(curl -s -o "$RUNNER_TEMP/exchange.json" -w "%{http_code}" -X POST -H "Authorization: Bearer $idt" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")
          answer=$(node -p "(() => { const t = require('fs').readFileSync(process.argv[1], 'utf8'); try { const b = JSON.parse(t); return b.token ? 'a token was issued' : (b.message || b.error || t.slice(0, 300)); } catch { return t.slice(0, 300); } })()" "$RUNNER_TEMP/exchange.json")
          rm -f "$RUNNER_TEMP/exchange.json"
          echo "npm token exchange for $name: HTTP $code — $answer"
          case "$code" in   # the registry answers 201 Created when it issues the token
            2??) ;;
            *) echo "::error::npm does not trust this run for $name: compare the claims above with the package's Trusted Publisher settings (user, repository, workflow file, environment) and check that its allowed actions include this kind of publish"; exit 1 ;;
          esac
      - name: Publish
        env:
          MODE: ${{ vars.NPM_PUBLISH || 'stage' }}
        run: |
          if [ "$MODE" = "direct" ]; then
            npm publish --access public --provenance
          else
            npm stage publish --access public --provenance
            echo "::notice::staged ${GITHUB_REF_NAME} — approve it on npmjs.com (Staged Packages) or with 'npm stage approve <id>' (2FA)"
          fi

  # staged (NPM_PUBLISH unset), the release appears while the version waits for its approval on npm
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The GitHub Release, with the CHANGELOG.md entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/github-release.sh

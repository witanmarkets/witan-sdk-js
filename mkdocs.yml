site_name: witan-sdk for JavaScript
site_url: https://witanmarkets.github.io/witan-sdk-js/
site_description: WITAN, the knowledge and dataset market for AI agents, from anywhere fetch runs — Node, Deno, Bun, Workers and functions.
repo_url: https://github.com/witanmarkets/witan-sdk-js
repo_name: witanmarkets/witan-sdk-js
edit_uri: ""
copyright: WITAN · MIT license · testnet preview
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: witan-mark.png
  favicon: witan-mark.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  version:
    provider: mike
    default: stable
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/witanmarkets/witan-sdk-js
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/witan-sdk

extra_css:
  - stylesheets/witan.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search

validation:
  nav:
    omitted_files: info

nav:
  - Home: index.md
  - Guides:
      - Configuration: guide/configuration.md
      - Runtimes: guide/runtimes.md
      - Knowledge units: guide/knowledge.md
      - Datasets: guide/datasets.md
      - Paying: guide/paying.md
      - Signed versions: guide/trust.md
  - API reference: reference/index.md
  - Releases:
      - Release notes: changelog.md
      - Versions and deprecations: deprecations.md
